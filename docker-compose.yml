services:
  db:
    image: postgres:17
    container_name: hospital-db
    restart: unless-stopped
    env_file: .env
    # Modest memory settings for a 4 GB server
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
    ports:
      # 127.0.0.1 = only reachable from the server itself, never the internet
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pipeline:
    build: .
    image: hospital-pipeline
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    profiles: ["job"]   # not started by "docker compose up"; only runs when asked
    volumes:
      - ./status:/app/status
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build: ./dashboard
    image: hospital-dashboard
    container_name: hospital-dashboard
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # 127.0.0.1 = only reachable from the server itself; the web server in front makes it public
      - "127.0.0.1:5000:5000"
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
