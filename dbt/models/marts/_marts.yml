version: 2

models:
  - name: dim_reporting_unit
    description: One row per hospital, LHN, state or other reporting unit.
    columns:
      - name: reporting_unit_code
        data_tests: [unique, not_null]
      - name: reporting_unit_name
        data_tests: [not_null]

  - name: dim_measure
    description: One row per reported measure (a measure plus its breakdown).
    columns:
      - name: reported_measure_code
        data_tests: [unique, not_null]
      - name: units
        data_tests:
          - not_null:
              config:
                severity: warn

  - name: fct_hospital_measure
    description: One row per reporting unit, reported measure and period.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - reporting_unit_code
              - reported_measure_code
              - period_start
              - period_end
    columns:
      - name: fact_id
        data_tests: [unique, not_null]
      - name: reporting_unit_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_reporting_unit')
                field: reporting_unit_code
      - name: reported_measure_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_measure')
                field: reported_measure_code
      - name: period_end
        data_tests: [not_null]

  - name: ml_ed_features
    description: >
      One row per hospital and financial year: % leaving ED within 4 hours (target)
      plus size and patient-mix inputs for the expected-vs-actual model.
      "<5" patient counts are filled with 2; other missing values drop the row.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [reporting_unit_code, period_label]
    columns:
      - name: pct_within_4h
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: ed_presentations
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: share_resus_emergency
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: share_non_urgent
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: share_admitted
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
