version: 2

sources:
  - name: ml
    schema: marts
    description: Written by pipeline/ml_expected.py (not dbt). Tested after the model step in pipeline/main.py.
    tables:
      - name: ml_ed_expected
        description: Expected vs actual % leaving ED within 4 hours, one row per hospital-year, with funnel flags.
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [reporting_unit_code, period_label]
        columns:
          - name: expected
            data_tests:
              - not_null
              - dbt_utils.accepted_range:
                  arguments: {min_value: 0, max_value: 100}
          - name: flag
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["well above expected", "well below expected", "within expected range"]
          - name: reporting_unit_code
            data_tests:
              - relationships:
                  arguments:
                    to: ref('dim_reporting_unit')
                    field: reporting_unit_code
