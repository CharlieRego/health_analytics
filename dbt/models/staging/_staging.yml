version: 2

models:
  - name: stg_myh__flat
    description: >
      Typed rows from the latest data version of each MyHospitals category.
      dup_rank > 1 marks duplicate source rows, which are excluded from the marts.
    columns:
      - name: raw_id
        data_tests: [unique, not_null]
      - name: reporting_unit_code
        data_tests: [not_null]
      - name: reported_measure_code
        data_tests: [not_null]
